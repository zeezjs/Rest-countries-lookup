<!DOCTYPE html>
<html lang="en" data-bs-theme="dark" class="html">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rest Country API | Frontend Mentor Challenge</title>

    <!-- Local Bootstrap CSS -->
    <link rel="stylesheet" href="vendor/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Css -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <nav class="navbar navbar-expand-sm bg-body-tertiary mb-5">
        <div class="container">
            <h3>Where in the world?</h3>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
            <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
                <li class="nav-item">
                <button class="btn btn-sm btn-outline-primary theme-toggler">
                    <i class="bi bi-brightness-high-fill"></i> Light Mode
                </button>
                </li>
            </ul>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="row">
            <div class="col-md-6">
                <div class="input-group mb-3">
                    <span class="input-group-text" id="basic-addon1"><i class="bi bi-search"></i></span>
                    <input type="search" class="form-control search-bar" id="search-input" placeholder="Search for a country" aria-label="Username" aria-describedby="basic-addon1">
                </div>
            </div>
            <div class="col-md-2">
                <!-- Spacer -->
            </div>
            <div class="col-5 col-md-4">
                <select class="form-select" aria-label="Default select example" id="regionOption">
                    <option selected>All countries</option>
                    <option value="Africa">Africa</option>
                    <option value="Americas">America</option>
                    <option value="Asia">Asia</option>
                    <option value="Europe">Europe</option>
                    <option value="Oceania">Oceania</option>
                </select>
            </div>
        </div>
    </div>

    <div class="container mt-5 ">
        <div class="country-list row">
            <!-- Country cards will be injected here by JavaScript -->
        </div>
    </div>

  

    <!-- Local Bootstrap JS bundle -->
    <script src="vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
    <script src="country.js"></script>
    <script src="app.js"></script>
    <script src="homepage.js"></script>
</body>
</html>
